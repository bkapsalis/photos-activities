workflows:
  # ── Dev Build ──────────────────────────────────────────
  dev-build:
    name: Dev Build
    max_build_duration: 30
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: dev
          include: true
    environment:
      flutter: 3.47.1
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze --no-fatal-infos
      - name: Run tests
        script: flutter test
      - name: Build Android APK (Dev)
        script: flutter build apk --flavor dev -t lib/main_dev.dart --debug
      - name: Build Web (Dev)
        script: flutter build web -t lib/main_dev.dart
    artifacts:
      - build/app/outputs/flutter-apk/app-dev-debug.apk
      - build/web/**

  # ── Staging Build ──────────────────────────────────────
  # Android goes to the internal-testers group by Firebase App Distribution,
  # iOS to TestFlight (App Store Connect app "Bill's Bay Area Staging"), and
  # the web app to photos-activities-staging.web.app.
  #
  # Needs, in Codemagic: the Android keystore "bills_upload_key" (Code
  # signing identities); the App Store Connect API key "bills_asc_key"
  # (Integrations > Developer Portal), with which Codemagic creates and
  # renews the iOS certificate and provisioning profile itself; and the
  # variable groups "staging" (FIREBASE_SERVICE_ACCOUNT, the
  # codemagic-staging service account's JSON key) and "maps"
  # (MAPS_API_KEY_ANDROID, MAPS_API_KEY_IOS).
  staging-build:
    name: Staging Build
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: bills_asc_key
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: staging
          include: true
    environment:
      flutter: 3.47.1
      xcode: latest
      groups:
        - staging
        - maps
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.billsbayarea.app.staging
      # Provides CM_KEYSTORE_PATH and friends, which build.gradle.kts reads
      # to sign release builds with the upload key.
      android_signing:
        - bills_upload_key
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Check and write the Maps keys
        # Without a key the map is blank but nothing fails, so check here.
        # Android's build.gradle.kts reads MAPS_API_KEY_ANDROID itself; iOS
        # reads ios/Flutter/Maps.xcconfig, gitignored, so write it.
        script: |
          for v in MAPS_API_KEY_ANDROID MAPS_API_KEY_IOS; do
            if [ -z "${!v}" ]; then
              echo "Missing $v: add it to the 'maps' variable group in Codemagic."
              exit 1
            fi
          done
          echo "MAPS_API_KEY=$MAPS_API_KEY_IOS" > ios/Flutter/Maps.xcconfig
      - name: Analyze
        script: flutter analyze --no-fatal-infos
      - name: Run tests
        script: flutter test
      - name: Build Android APK (Staging)
        # Codemagic's own counter, so every build has a higher version code.
        script: |
          flutter build apk --flavor staging -t lib/main_staging.dart \
            --release --build-number=$BUILD_NUMBER
      - name: Apply the iOS signing files to the Xcode project
        script: xcode-project use-profiles
      - name: Build iOS IPA (Staging)
        # Same build counter as Android; TestFlight needs each upload's
        # build number to be higher than the last.
        script: |
          flutter build ipa --flavor staging -t lib/main_staging.dart \
            --release --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Build Web (Staging)
        script: flutter build web -t lib/main_staging.dart --release
      - name: Publish Web to Firebase Hosting (Staging)
        script: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$CM_BUILD_DIR/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$CM_BUILD_DIR/firebase-sa.json"
          command -v firebase >/dev/null || npm install -g firebase-tools
          firebase deploy --only hosting --project photos-activities-staging \
            --non-interactive --message "Codemagic build $BUILD_NUMBER"
          rm -f "$CM_BUILD_DIR/firebase-sa.json"
    artifacts:
      - build/app/outputs/flutter-apk/app-staging-release.apk
      - build/ios/ipa/*.ipa
      - build/web/**
    publishing:
      app_store_connect:
        auth: integration
        # Once Apple has processed an upload, internal testers (App Store
        # Connect users in a TestFlight internal group) can install it. true
        # would also submit it to Beta App Review for external testers, which
        # needs the TestFlight Test Information page filled in first.
        submit_to_testflight: false
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT
        android:
          # The staging Android app's id (not a secret; it is also in
          # android/app/src/staging/google-services.json).
          app_id: 1:593867148848:android:afaf2244424d0b8022a7f5
          groups:
            - internal-testers

  # ── Production Release ─────────────────────────────────
  prod-release:
    name: Production Release
    max_build_duration: 60
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    environment:
      flutter: stable
      groups:
        - firebase_credentials
        - android_signing
        - ios_signing
        - play_store
        - app_store
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze --no-fatal-infos
      - name: Run tests
        script: flutter test
      - name: Build Android App Bundle (Prod)
        script: flutter build appbundle --flavor prod -t lib/main_prod.dart --release
      - name: Build iOS (Prod)
        script: |
          flutter build ipa --flavor prod -t lib/main_prod.dart --release \
            --export-options-plist=/tmp/ExportOptions.plist
      - name: Build Web (Prod)
        script: flutter build web -t lib/main_prod.dart
    artifacts:
      - build/app/outputs/bundle/prodRelease/app-prod-release.aab
      - build/ios/ipa/*.ipa
      - build/web/**
    # Off for the same reason as staging's publishing. When restoring, start
    # on the internal track and promote to production by hand.
    # publishing:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: production
    #   app_store_connect:
    #     api_key: $APP_STORE_CONNECT_PRIVATE_KEY
    #     key_id: $APP_STORE_CONNECT_KEY_ID
    #     issuer_id: $APP_STORE_CONNECT_ISSUER_ID
